# ---------------------------------------------------------------------------
# MeetU2 - topología híbrida monolito + microservicios (Strangler Pattern >70%)
#
#   navegador --> nginx:80 --+--> /api/v2/pagos          --> pagos (Flask:5000)
#                            +--> /api/v2/social         --> social (Flask:5001)
#                            +--> /api/v2/notificaciones --> notificaciones (Flask:5002)
#                            +--> /api/v2/catalogo       --> catalogo (Flask:5003)
#                            +--> /api/v1, /             --> django (Django:8000)
#
#   db (PostgreSQL) -> meetu2, meetu2_pagos, meetu2_social, meetu2_notificaciones, meetu2_catalogo
#   broker (Redis)  -> celery worker
# ---------------------------------------------------------------------------

x-db-credenciales: &db-credenciales
  POSTGRES_USER: ${POSTGRES_USER:-meetu2}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetu2_dev}

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *db-credenciales
      POSTGRES_DB: meetu2
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d meetu2"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------- message broker (redis)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------- monolito legado
  django:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *db-credenciales
      POSTGRES_HOST: db
      POSTGRES_DB: meetu2
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,django,*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      CANAL_NOTIFICACION: asincrono
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Strangler: Django verifica los pagos contra el microservicio.
      PAGOS_SERVICE_URL: http://pagos:5000
      PAGOS_V2_HABILITADO: "True"
      SEED_DEMO: ${SEED_DEMO:-1}
      SERVICIO_ALIADO_URL: ${SERVICIO_ALIADO_URL:-}
      CLIMA_PROVIDER: ${CLIMA_PROVIDER:-open_meteo}
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # --------------------------------------------- celery worker (async tasks)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    environment:
      <<: *db-credenciales
      POSTGRES_HOST: db
      POSTGRES_DB: meetu2
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-en-produccion}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CANAL_NOTIFICACION: consola
      SKIP_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy

  # -------------------------------------------- microservicio estrangulado
  pagos:
    build:
      context: ./services/pagos
      dockerfile: Dockerfile
    environment:
      PAGOS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meetu2}:${POSTGRES_PASSWORD:-meetu2_dev}@db:5432/meetu2_pagos
      PASARELA_PAGO: ${PASARELA_PAGO:-fake}
      # Anti-Corruption Layer: Flask lee/confirma reservas por la API de Django.
      MONOLITO_URL: http://django:8000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  # -------------------------------------------- microservicio estrangulado (social)
  social:
    build:
      context: ./services/social
      dockerfile: Dockerfile
    environment:
      SOCIAL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meetu2}:${POSTGRES_PASSWORD:-meetu2_dev}@db:5432/meetu2_social
      MONOLITO_URL: http://django:8000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5001"

  # -------------------------------------------- microservicio estrangulado (notificaciones)
  notificaciones:
    build:
      context: ./services/notificaciones
      dockerfile: Dockerfile
    environment:
      NOTIFICACIONES_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meetu2}:${POSTGRES_PASSWORD:-meetu2_dev}@db:5432/meetu2_notificaciones
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5002"

  # -------------------------------------------- microservicio estrangulado (catalogo)
  catalogo:
    build:
      context: ./services/catalogo
      dockerfile: Dockerfile
    environment:
      CATALOGO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meetu2}:${POSTGRES_PASSWORD:-meetu2_dev}@db:5432/meetu2_catalogo
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5003"

  # ------------------------------------------- fachada / reverse proxy
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      django:
        condition: service_healthy
      pagos:
        condition: service_healthy
      social:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
      catalogo:
        condition: service_healthy

volumes:
  pg_data:
  static_files:
