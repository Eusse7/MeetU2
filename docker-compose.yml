# ---------------------------------------------------------------------------
# MeetU2 - topologia hibrida monolito + microservicio (Strangler Pattern)
#
#   navegador --> nginx:80 --+--> /api/v2/pagos --> pagos  (Flask)  --+
#                            |                                       |  HTTP interno
#                            +--> /api/v1, /     --> django (Django) <-+
#                                                      |        |
#                                   db (PostgreSQL) <--+--------+
#                                   meetu2 (Django) | meetu2_pagos (Flask)
#
#   docker compose up --build     ->  http://localhost:8080
# ---------------------------------------------------------------------------

x-db-credenciales: &db-credenciales
  POSTGRES_USER: ${POSTGRES_USER:-meetu2}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetu2_dev}

services:
  db:
    image: postgres:17-alpine
    environment:
      <<: *db-credenciales
      POSTGRES_DB: meetu2
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d meetu2"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ----------------------------------------------------- monolito legado
  django:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *db-credenciales
      POSTGRES_HOST: db
      POSTGRES_DB: meetu2
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-en-produccion}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      CANAL_NOTIFICACION: consola
      # Strangler: Django verifica los pagos contra el microservicio.
      PAGOS_SERVICE_URL: http://pagos:5000
      PAGOS_V2_HABILITADO: "True"
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # -------------------------------------------- microservicio estrangulado
  pagos:
    build:
      context: ./services/pagos
      dockerfile: Dockerfile
    environment:
      PAGOS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-meetu2}:${POSTGRES_PASSWORD:-meetu2_dev}@db:5432/meetu2_pagos
      PASARELA_PAGO: ${PASARELA_PAGO:-fake}
      # Anti-Corruption Layer: Flask lee/confirma reservas por la API de Django.
      MONOLITO_URL: http://django:8000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"

  # ------------------------------------------- fachada / reverse proxy
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      django:
        condition: service_healthy
      pagos:
        condition: service_healthy

volumes:
  pg_data:
  static_files:
