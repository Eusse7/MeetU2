# ---------------------------------------------------------------------------
# MeetU2 - Reverse proxy / fachada del Strangler Pattern (Taller 02)
#
# Un unico punto de entrada (puerto 80) que bifurca el trafico por URL:
#   /api/v2/pagos/...  -> microservicio Flask   (funcionalidad estrangulada)
#   /api/v1/...        -> monolito Django       (rutas legadas)
#   /static/...        -> archivos estaticos del monolito (servidos por Nginx)
#   /                  -> monolito Django       (front, admin, healthz)
#
# El cliente nunca sabe que hay dos backends: estrangular el siguiente modulo
# es agregar otro bloque `location` aqui.
# ---------------------------------------------------------------------------

upstream django_monolito {
    server django:8000;
}

upstream flask_pagos {
    server pagos:5000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    # Si un backend esta caido (Nginx no logra conectar), el cliente recibe
    # JSON y no la pagina HTML de Nginx. Los errores que el backend SI emite
    # (p. ej. el 503 estructurado de Flask) pasan intactos.
    error_page 502 504 = @backend_caido;

    # ------------------------------------------ Microservicio nuevo (Flask)
    location /api/v2/pagos {
        add_header X-Servido-Por "flask-pagos" always;
        proxy_pass http://flask_pagos;
    }

    # Cualquier otra ruta v2 aun no ha sido migrada.
    location /api/v2/ {
        default_type application/json;
        return 404 '{"error": {"codigo": "ruta_no_migrada", "mensaje": "Esta funcionalidad aun no existe en /api/v2; usa /api/v1"}}';
    }

    # ---------------------------------------------- Monolito legado (Django)
    location /api/v1/ {
        add_header X-Servido-Por "django-monolito" always;
        proxy_pass http://django_monolito;
    }

    location /static/ {
        alias /var/www/static/;
        expires 1h;
        access_log off;
    }

    location / {
        add_header X-Servido-Por "django-monolito" always;
        proxy_pass http://django_monolito;
    }

    location @backend_caido {
        default_type application/json;
        return 503 '{"error": {"codigo": "servicio_no_disponible", "mensaje": "El servicio no esta disponible en este momento, intenta de nuevo"}}';
    }
}
